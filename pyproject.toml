[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbac-paths"
version = "0.1.0"
description = "Offline Kubernetes RBAC privilege-escalation path finder, over local kubectl JSON dumps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "David Nichols" }]
keywords = [
    "kubernetes",
    "rbac",
    "privilege-escalation",
    "security",
    "audit",
    "offline",
    "cluster-admin",
    "attack-path",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

# No dependencies, deliberately. The input is JSON, so no YAML parser is
# needed, and there is no API client because the tool never opens a socket.
# tests/test_no_network.py enforces both.
dependencies = []

[project.urls]
Homepage = "https://github.com/Young-Syre/rbac-paths"
Source = "https://github.com/Young-Syre/rbac-paths"
Issues = "https://github.com/Young-Syre/rbac-paths/issues"

[project.scripts]
rbac-paths = "rbac_paths.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbac_paths = ["py.typed"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Each finding's prose sits next to the condition that produces it, which
    # is easier to review than prose kept somewhere else, and that makes some
    # lines long.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
